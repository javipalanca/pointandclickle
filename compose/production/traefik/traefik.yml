log:
  level: INFO

entryPoints:
  web:
    # http
    address: ":80"
    http:
      # https://docs.traefik.io/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ":443"

certificatesResolvers:
  letsencrypt:
    # https://docs.traefik.io/master/https/acme/#lets-encrypt
    acme:
      email: "jpalanca@gmail.com"
      storage: /etc/traefik/acme/acme.json
      # https://docs.traefik.io/master/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    web-secure-router:
      rule: "Host(`pointandclickle.com`) || Host(`www.pointandclickle.com`)"
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls:
        # https://docs.traefik.io/master/routing/routers/#certresolver
        certResolver: letsencrypt

    museum-router:
      rule: "Host(`museum.pointandclickle.com`)"
      entryPoints:
        - web-secure
      service: museum
      tls:
        certResolver: letsencrypt
    museum-path-router:      # pointandclickle.com/museum/... -> museum.pointandclickle.com/... (301)
      rule: "(Host(`pointandclickle.com`) || Host(`www.pointandclickle.com`)) && PathPrefix(`/museum`)"
      entryPoints:
        - web-secure
      middlewares:
        - museum-redirect
      service: museum
      tls:
        certResolver: letsencrypt

  middlewares:
    csrf:
      # https://docs.traefik.io/master/middlewares/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ["X-CSRFToken"]

    museum-redirect:
      redirectRegex:
        regex: "^https?://[^/]+/museum/?(.*)$"
        replacement: "https://museum.pointandclickle.com/${1}"
        permanent: true

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    museum:
      loadBalancer:
        servers:
          - url: http://museum-web:80

providers:
  # https://docs.traefik.io/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
